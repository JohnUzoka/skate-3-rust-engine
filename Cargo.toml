[workspace]
members = ["crates/skate-core", "crates/skate-audio", "crates/skate-audio-fma", "crates/skate-data", "crates/skate-game", "crates/skate-dynamics", "crates/skate-mods", "crates/skate-net", "crates/skate-steam-relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Default features off so the Switch port can leave out Bevy's desktop backends; skate-game turns
# them back on for every other target, so desktop builds are unchanged.
bevy = { version = "=0.18.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
bevy_ui_render = { path = "vendor/bevy_ui_render" }
bevy_ui = { path = "vendor/bevy_ui" }
sdl3-sys = { path = "vendor/sdl3-sys" }
